---
# =========================================================
# AWS dev inventory
#
# EKS has no host to SSH into for cluster bootstrap: the control plane is
# managed and the nodes are joined by the managed node group. Every task in
# the playbook therefore runs on the control host and talks to the AWS and
# Kubernetes APIs.
#
# Node level operations (patching, debugging a kubelet) use the dynamic
# inventory in aws_ec2.yml, which reaches instances through SSM rather than
# SSH. There is no SSH key and no inbound port 22 anywhere in this platform.
# =========================================================
all:
  children:

    aws_control_host:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
