---
# Hooks run before a commit lands, so CI is a confirmation rather than a
# discovery. Install with: pre-commit install
repos:
  ########################################
  # General Git Checks
  ########################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key

      # The one secret this repository is most likely to leak is the one it
      # claims not to contain. --allow-missing-credentials so the hook does not
      # fail on a machine that has never configured the AWS CLI.
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]

      - id: check-executables-have-shebangs
      - id: forbid-submodules
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-json
      - id: check-yaml
        # Ansible and Kubernetes both use multi-document YAML, and the Helm
        # values templates are not valid YAML until rendered.
        args: ["--allow-multiple-documents"]
        exclude: ^kubernetes/monitoring/


  ########################################
  # Terraform
  ########################################
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt

      - id: terraform_validate
        args:
          - "--init-args=-backend=false"

      - id: terraform_docs
        args:
          - "--hook-config=--path-to-file=README.md"
          - "--hook-config=--add-to-existing-file=true"
          - "--hook-config=--create-file-if-not-exist=true"

      # tflint, with the AWS ruleset configured in .tflint.hcl
      - id: terraform_tflint
        args:
          - "--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"


  ########################################
  # Terraform Security
  ########################################
  - repo: https://github.com/aquasecurity/tfsec
    rev: v1.28.14
    hooks:
      - id: tfsec

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.13
    hooks:
      - id: checkov
        args: ["--framework", "terraform", "--quiet", "--compact"]


  ########################################
  # Secret Detection
  ########################################
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks


  ########################################
  # Ansible
  ########################################
  # Reads .ansible-lint, which scopes it to Ansible content and keeps
  # var-naming[no-role-prefix] as a warning rather than a failure.
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint


  ########################################
  # GitHub Actions
  ########################################
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint


  ########################################
  # YAML / Kubernetes
  ########################################
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint


  ########################################
  # Markdown
  ########################################
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
