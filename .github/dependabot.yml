version: 2

updates:
  # Pinned action SHAs go stale silently, and a stale action is where a known
  # CVE lives longest in a repository like this one.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - "/environments/bootstrap"
      - "/environments/dev"
      - "/environments/staging"
      - "/environments/production"
      - "/modules/vpc"
      - "/modules/eks"
      - "/modules/eks-platform-iam"
      - "/modules/irsa"
      - "/modules/ecr"
      - "/modules/tf-state-backend"
      - "/modules/github-oidc"
      - "/modules/security-baseline"
      - "/modules/cost-controls"
      - "/modules/observability"
      - "/modules/backup"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
    directory: "/ansible"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
