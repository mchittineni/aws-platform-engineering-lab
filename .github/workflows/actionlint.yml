name: Workflow Lint

# The workflows here hold the AWS deployment credentials. A typo in an `if:`
# expression is a security problem, not a style problem.
on:
  pull_request:
    paths:
      - ".github/workflows/**"

jobs:
  actionlint:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The released binary rather than a wrapper action. raven-actions/actionlint
      # shells out through actions/github-script to require @actions/tool-cache,
      # which fails to resolve on the Node 24 runner
      # (ERR_PACKAGE_PATH_NOT_EXPORTED) and takes the whole job with it. A
      # pinned tarball has no such moving parts.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
