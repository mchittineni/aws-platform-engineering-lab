---
name: Workflow Lint

# The workflows here hold the AWS deployment credentials. A typo in an `if:`
# expression is a security problem, not a style problem.
on:
  pull_request:
    paths:
      - ".github/workflows/**"

jobs:
  actionlint:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
        with:
          fail-on-error: true
