name: Terraform Security Scan

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - ".github/workflows/terraform-security.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  tfsec:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: tfsec
        uses: aquasecurity/tfsec-sarif-action@21ded20e8ca120cd9d3d6ab04ef746477542a608  # v0.1.4
        with:
          sarif_file: tfsec.sarif

      # Code scanning needs GitHub Advanced Security on a private repository, so
      # on this one the upload returns "Resource not accessible by integration".
      # The finding gate is the step that fails the job, not this upload, so a
      # missing Security tab must not turn the build red. Drop
      # continue-on-error if the repository becomes public or gets GHAS.
      - name: Upload the tfsec SARIF report
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f1f6e5f6af878fb37288ce1c627459e94dbf7d01  # v3.28.5
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      - name: Fail on any tfsec finding
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6  # v1.0.3
        with:
          soft_fail: false

  checkov:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      # Installed from pip rather than through checkov-action. That action runs
      # a Docker image pinned at checkov 2.0.930, which is both years behind the
      # version pre-commit and `make security` use — so CI was enforcing a
      # different check set than any local run — and old enough to reject
      # `--output cli,sarif`, which is why this job never got as far as scanning.
      #
      # Pinned to the same version as .pre-commit-config.yaml. Bump both together.
      - name: Install Checkov
        run: pip install checkov==3.3.13

      # Checkov exits non-zero on a finding, so this step is the gate. Every
      # accepted finding carries an inline `#checkov:skip` with its reason.
      #
      # No SARIF upload: code scanning needs GitHub Advanced Security on a
      # private repository, and a report nobody can read is not worth a step
      # that fails. The cli output in this log is the record.
      - name: Checkov
        run: checkov --directory . --framework terraform --quiet --compact
