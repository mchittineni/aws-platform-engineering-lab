name: Terraform Security Scan

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - ".github/workflows/terraform-security.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  tfsec:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: tfsec
        uses: aquasecurity/tfsec-sarif-action@21ded20e8ca120cd9d3d6ab04ef746477542a608  # v0.1.4
        with:
          sarif_file: tfsec.sarif

      - name: Upload the tfsec SARIF report
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v3.28.5
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      - name: Fail on any tfsec finding
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6  # v1.0.3
        with:
          soft_fail: false

  checkov:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Checkov
        run: pip install checkov==3.3.13

      - name: Checkov
        run: checkov --directory . --framework terraform --quiet --compact
