name: Terraform Security Scan

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - ".github/workflows/terraform-security.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  tfsec:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: tfsec
        uses: aquasecurity/tfsec-sarif-action@21ded20e8ca120cd9d3d6ab04ef746477542a608  # v0.1.4
        with:
          sarif_file: tfsec.sarif

      # Code scanning needs GitHub Advanced Security on a private repository, so
      # on this one the upload returns "Resource not accessible by integration".
      # The finding gate is the step that fails the job, not this upload, so a
      # missing Security tab must not turn the build red. Drop
      # continue-on-error if the repository becomes public or gets GHAS.
      - name: Upload the tfsec SARIF report
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f1f6e5f6af878fb37288ce1c627459e94dbf7d01  # v3.28.5
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      - name: Fail on any tfsec finding
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6  # v1.0.3
        with:
          soft_fail: false

  checkov:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf  # v12.1347.0
        with:
          directory: .
          framework: terraform
          quiet: true
          output_format: cli,sarif
          # Without this the action leaves the report at its own default path
          # and the upload step fails with "Path does not exist: checkov.sarif".
          # `console` is the destination for the cli half of output_format.
          output_file_path: "console,checkov.sarif"

      # Code scanning needs GitHub Advanced Security on a private repository, so
      # on this one the upload returns "Resource not accessible by integration".
      # The finding gate is the step that fails the job, not this upload, so a
      # missing Security tab must not turn the build red. Drop
      # continue-on-error if the repository becomes public or gets GHAS.
      - name: Upload the Checkov SARIF report
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f1f6e5f6af878fb37288ce1c627459e94dbf7d01  # v3.28.5
        with:
          sarif_file: checkov.sarif
          category: checkov
