name: Pre Commit

on:
  pull_request:

jobs:

  precommit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pinned rather than "3.x": the ansible-lint hook declares
      # language_version python3.14, and pre-commit fails to build its
      # virtualenv if that exact interpreter is not on PATH.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"

      - name: Install pre-commit
        run: |
          pip install pre-commit

      - name: Run hooks
        run: |
          pre-commit run --all-files
