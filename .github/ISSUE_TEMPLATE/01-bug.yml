---
name: Something does not work
description: A module, playbook or workflow behaves differently from what it documents.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Not for security problems.** If the issue is that something grants
        more access than it should, is reachable by an untrusted fork, or
        exposes a credential, close this and use private vulnerability
        reporting on the repository's Security tab instead. See `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behaviour, and the behaviour you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The commands, in order. `terraform plan` output is more useful than a
        description of the plan output.
      placeholder: |
        1. cd environments/dev
        2. terraform init -backend=false
        3. terraform plan
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: >-
        Error text, plan output, or the failing CI step. Redact account IDs,
        ARNs with a real account in them, and hostnames.
      render: text
    validations:
      required: true

  - type: input
    id: scope
    attributes:
      label: Where
      description: The stack, module or role. One place, if you can narrow it.
      placeholder: modules/eks, environments/staging, ansible/roles/argocd
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: >-
        Terraform, provider and CLI versions. `terraform version` covers the
        first two.
      placeholder: terraform 1.13.1, hashicorp/aws 6.x, ansible-core 2.18
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - dev
        - staging
        - production
        - bootstrap
        - none, this is a code-only problem
    validations:
      required: true

  - type: checkboxes
    id: checked
    attributes:
      label: Before opening
      options:
        - label: "`make validate` reproduces it, or I have said why it does not"
          required: true
        - label: I have read the known gaps in `docs/security.md` and this is not one of them
          required: true
