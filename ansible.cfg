[defaults]
# dev by default. Override per run:
#   ansible-playbook -i ansible/inventory/production/hosts.yml ...
inventory = ./ansible/inventory/dev/hosts.yml
roles_path = ./ansible/roles

interpreter_python = auto_silent
stdout_callback = default
display_skipped_hosts = False

# A role that quietly does nothing because a variable is undefined is worse
# than a run that stops and says so.
error_on_undefined_vars = True

# Kubernetes API calls have long tails during a rollout.
timeout = 60

[inventory]
# aws_ec2 is needed for ansible/inventory/<env>/aws_ec2.yml. Without it the
# plugin is skipped silently and the inventory comes back empty.
enable_plugins = amazon.aws.aws_ec2, yaml, ini, auto, host_list, script

# Fail loudly when an inventory source cannot be parsed, instead of returning
# an empty host list.
unparsed_is_failed = True

[ssh_connection]
# There is no SSH in this platform: no key pair on the node groups and no
# inbound port 22. The bootstrap playbook runs entirely against the AWS and
# Kubernetes APIs, and anything that has to reach an instance goes through
# Session Manager:
#
#   aws ssm start-session --target <instance-id>
#
# The settings below only apply to the aws_ec2 dynamic inventory used for node
# level debugging through an SSM proxy.
pipelining = True
