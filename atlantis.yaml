---
version: 3

# Atlantis is the alternative to the workflow_dispatch apply: a plan comment on
# the pull request and an `atlantis apply` after approval. Only one of the two
# should be enabled at a time, or an apply can race a manual dispatch.

automerge: false
parallel_plan: true
parallel_apply: false

projects:

  ####################################
  # bootstrap
  #
  # Creates the state bucket, the CI roles and the account security baseline,
  # so it is applied by hand once per account and never autoplanned.
  ####################################
  - name: bootstrap
    dir: environments/bootstrap
    workflow: terraform
    autoplan:
      enabled: false
    apply_requirements:
      - approved
      - mergeable

  ####################################
  # dev
  ####################################
  - name: dev
    dir: environments/dev
    workflow: terraform
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - "../../modules/**/*.tf"

  ####################################
  # staging
  ####################################
  - name: staging
    dir: environments/staging
    workflow: terraform
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - "../../modules/**/*.tf"
    apply_requirements:
      - approved
      - mergeable

  ####################################
  # production
  #
  # Production plans are requested explicitly. An autoplan on every module
  # change would queue a production plan for a dev-only edit, and a queued
  # production plan is something people learn to scroll past.
  ####################################
  - name: production
    dir: environments/production
    workflow: terraform
    autoplan:
      enabled: false
    apply_requirements:
      - approved
      - mergeable
      - undiverged


####################################
# Terraform Workflow
####################################
workflows:

  terraform:

    plan:
      steps:
        - init
        - plan:
            extra_args:
              - "-lock=true"

    apply:
      steps:
        - apply
